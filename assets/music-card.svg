<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Yuchen Wang's all-time listening snapshot</title>
  <desc id="desc">11,410 tracks logged on NetEase Cloud. Most replayed tracks include Paris, Wild Eyes, Pop Style, emily's song, and This Place Is a Shelter.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f5ca8"/>
      <stop offset="1" stop-color="#7658b3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#16243d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="330" rx="20" fill="#dfe7f3"/>
  <rect x="1" y="1" width="898" height="328" rx="19" fill="url(#paper)" stroke="#cbd6e6" filter="url(#shadow)"/>
  <path d="M0 20Q0 0 20 0H238L117 330H20Q0 330 0 310Z" fill="#e9eef8" opacity="0.8"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#15233a">
    <g transform="translate(42 42)">
      <rect width="36" height="36" rx="10" fill="url(#accent)"/>
      <path d="M10 20v-3a8 8 0 0 1 16 0v3M10 20h3v8h-3a3 3 0 0 1-3-3v-2a3 3 0 0 1 3-3Zm16 0h-3v8h3a3 3 0 0 0 3-3v-2a3 3 0 0 0-3-3Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="13" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#566782">LISTENING / ALL-TIME SNAPSHOT</text>
      <text x="50" y="34" font-size="14" font-weight="600" fill="#253957">NetEase Cloud Music</text>
    </g>

    <g transform="translate(42 124)">
      <text y="55" font-size="60" font-weight="760" letter-spacing="-2.2">11,410</text>
      <text x="4" y="83" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.7" fill="#566782">TRACKS LOGGED</text>
      <rect x="0" y="108" width="302" height="1" fill="#c8d3e3"/>
      <text x="0" y="137" font-size="13" font-weight="560" fill="#40536f">hip-hop &amp; trap · EDM · alt-pop</text>
      <text x="0" y="158" font-size="13" font-weight="560" fill="#40536f">ambient &amp; post-rock</text>
    </g>

    <g transform="translate(410 42)">
      <text x="0" y="12" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#566782">MOST REPLAYED</text>
      <text x="444" y="12" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="650" fill="#76869d">PLAYS</text>

      <g transform="translate(0 34)">
        <text x="0" y="15" font-size="14" font-weight="650">01</text><text x="35" y="15" font-size="14" font-weight="650">Paris</text><text x="444" y="15" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">309</text>
        <rect x="35" y="26" width="372" height="4" rx="2" fill="#d9e1ed"/><rect x="35" y="26" width="372" height="4" rx="2" fill="url(#accent)"/>
        <text x="35" y="45" font-size="10.5" fill="#6b7b92">The Chainsmokers</text>
      </g>
      <g transform="translate(0 82)">
        <text x="0" y="15" font-size="14" font-weight="650">02</text><text x="35" y="15" font-size="14" font-weight="650">Wild Eyes</text><text x="444" y="15" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">305</text>
        <rect x="35" y="26" width="372" height="4" rx="2" fill="#d9e1ed"/><rect x="35" y="26" width="367" height="4" rx="2" fill="url(#accent)"/>
        <text x="35" y="45" font-size="10.5" fill="#6b7b92">Broiler / RAVVEL</text>
      </g>
      <g transform="translate(0 130)">
        <text x="0" y="15" font-size="14" font-weight="650">03</text><text x="35" y="15" font-size="14" font-weight="650">Pop Style</text><text x="444" y="15" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">301</text>
        <rect x="35" y="26" width="372" height="4" rx="2" fill="#d9e1ed"/><rect x="35" y="26" width="362" height="4" rx="2" fill="url(#accent)"/>
        <text x="35" y="45" font-size="10.5" fill="#6b7b92">Drake</text>
      </g>
      <g transform="translate(0 178)">
        <text x="0" y="15" font-size="14" font-weight="650">04</text><text x="35" y="15" font-size="14" font-weight="650">emily's song</text><text x="444" y="15" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">301</text>
        <rect x="35" y="26" width="372" height="4" rx="2" fill="#d9e1ed"/><rect x="35" y="26" width="362" height="4" rx="2" fill="url(#accent)"/>
        <text x="35" y="45" font-size="10.5" fill="#6b7b92">the tumbled sea</text>
      </g>
      <g transform="translate(0 226)">
        <text x="0" y="15" font-size="14" font-weight="650">05</text><text x="35" y="15" font-size="14" font-weight="650">This Place Is a Shelter</text><text x="444" y="15" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">296</text>
        <rect x="35" y="26" width="372" height="4" rx="2" fill="#d9e1ed"/><rect x="35" y="26" width="356" height="4" rx="2" fill="url(#accent)"/>
        <text x="35" y="45" font-size="10.5" fill="#6b7b92">Ólafur Arnalds</text>
      </g>
    </g>
  </g>
</svg>
