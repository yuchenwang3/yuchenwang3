name: Generate contribution animation

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile assets
        uses: actions/checkout@v4

      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%232148B8&color_dots=%238B949E,%23B9C7EB,%238DA5DE,%235D7DCA,%232148B8
            dist/github-snake-dark.svg?color_snake=%239AA2FF&color_dots=%238B949E,%236D79A8,%235A6EC2,%237D8FE0,%239AA2FF

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
