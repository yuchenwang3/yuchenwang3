name: Generate contribution animation

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "assets/music-card.svg"
      - "scripts/update-music-card.mjs"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile assets
        uses: actions/checkout@v4

      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Seed verified listening snapshot
        shell: bash
        run: cp assets/music-card.svg dist/music-card.svg

      - name: Refresh weekly most-played tracks when authorized
        env:
          NETEASE_MUSIC_U: ${{ secrets.NETEASE_MUSIC_U }}
          NETEASE_UID: "280472725"
        shell: bash
        run: |
          if [[ -z "$NETEASE_MUSIC_U" ]]; then
            echo "NETEASE_MUSIC_U is not configured; keeping the last verified snapshot."
            exit 0
          fi

          if ! npm install --no-save --ignore-scripts NeteaseCloudMusicApi@4.32.0; then
            echo "NetEase client install failed; keeping the last verified snapshot."
            exit 0
          fi

          if ! node scripts/update-music-card.mjs; then
            echo "Weekly listening refresh failed; keeping the last verified snapshot."
            cp assets/music-card.svg dist/music-card.svg
          fi

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
