name: Generate contribution animation

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile assets
        uses: actions/checkout@v4

      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23b42318&color_dots=%23ebedf0,%23f2cbc7,%23eaa49e,%23cf4b40,%23b42318
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ff7b72&color_dots=%23161b22,%236e2b28,%23a93a34,%23e05d55,%23ff7b72

      - name: Generate GitHub telemetry cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/render_github_telemetry.py
          --username "${{ github.repository_owner }}"
          --output-dir dist

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
