name: Refresh PR previews
on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"
permissions:
  contents: write
concurrency:
  group: pr-previews
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/refresh_pr_cards.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit changed previews
        run: |
          git add assets/prs README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public PR previews"
          git pull --rebase
          git push
